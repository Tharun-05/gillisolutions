# Content manager for the Gilli Solutions website.
# Staff open  <your-site>/admin/  , sign in with a GitHub access token, and edit
# client logos and project photos. Saving commits to GitHub; the site rebuilds in ~1–2 minutes.

backend:
  name: github
  repo: CHANGE-ME/gillisolutions   # ← your GitHub "owner/repository", e.g. pramodkumar/gillisolutions
  branch: main
  auth_methods: [token]            # token sign-in needs no extra server

app_title: Gilli Solutions · Content
logo_url: https://ik.imagekit.io/Gilli/Gilli_asserts/Images/gilli%20logo.webp?tr=h-120

# All uploads go here. The website's build converts the paths so they work in any folder.
media_folder: assets/uploads
public_folder: /assets/uploads

media_libraries:
  default:
    config:
      max_file_size: 15000000      # 15 MB before resizing
      slugify_filename: true
      transformations:
        # Phone photos are shrunk and converted to WebP in the browser before upload.
        raster_image:
          format: webp
          quality: 82
          width: 1800
          height: 1800

collections:
  - name: clients
    label: Client logos
    icon: business
    files:
      - name: clients
        label: Client logos (scrolling strip on the home page + Projects page)
        file: src/content/clients.json
        format: json
        fields:
          - name: items
            label: Clients
            label_singular: Client
            widget: list
            root: true
            add_to_top: true
            summary: "{{name}}"
            thumbnail: logo
            fields:
              - { name: name, label: Client name, widget: string,
                  hint: "Shown to screen readers and search engines, e.g. Akshaya Patra" }
              - { name: logo, label: Logo, widget: image, choose_url: false,
                  accept: "image/png,image/jpeg,image/webp,image/svg+xml",
                  hint: "Best: a PNG with a transparent or white background, cropped close to the logo." }

  - name: projects
    label: Project photos
    icon: photo_library
    files:
      - name: projects
        label: Project gallery (Projects page; the first 6 also show on the home page)
        file: src/content/projects.json
        format: json
        fields:
          - name: items
            label: Projects
            label_singular: Project
            widget: list
            root: true
            add_to_top: true
            summary: "{{name}}"
            thumbnail: photo
            fields:
              - { name: name, label: Project / client name, widget: string,
                  hint: "Shown as the photo caption, e.g. Anna Vilas, Kochi" }
              - { name: photo, label: Photo, widget: image, choose_url: false,
                  accept: "image/png,image/jpeg,image/webp",
                  hint: "A landscape photo works best. Large phone photos are resized automatically." }
